name: Spike ingestao (descartavel)

# Spike da stack (ADR 0006 em preparacao). Nao e check obrigatorio e o PR deste
# spike nao sera mesclado. So roda quando o proprio spike muda.
on:
  pull_request:
    paths:
      - 'spikes/ingestao/**'
      - '.github/workflows/spike-ingestao.yml'

permissions:
  contents: read

jobs:
  testes:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar pytest
        run: python -m pip install pytest

      - name: Testes do leitor
        run: python -m pytest spikes/ingestao -v

  medir:
    needs: testes
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        execucao: [1, 2, 3]
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGURL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Instalar psycopg
        run: python -m pip install "psycopg[binary]"

      - name: Medir (execução ${{ matrix.execucao }})
        run: python spikes/ingestao/medir.py executar
