# Ambiente de DESENVOLVIMENTO (ADR 0006). Copie .env.example para .env e preencha.
# Sem POSTGRES_PASSWORD e DJANGO_SECRET_KEY o Compose recusa subir (falha fechada).
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-polis}
      POSTGRES_USER: ${POSTGRES_USER:-polis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
    volumes:
      # No PostgreSQL 18 a imagem guarda os dados em /var/lib/postgresql (não em .../data).
      - pgdata:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?defina DJANGO_SECRET_KEY no .env}
      DJANGO_DEBUG: "1"
      # `web` é o nome do serviço: o front (Next.js) chama http://web:8000 pela rede do Compose.
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web
      POSTGRES_DB: ${POSTGRES_DB:-polis}
      POSTGRES_USER: ${POSTGRES_USER:-polis}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    volumes:
      - .:/app
    ports:
      - "127.0.0.1:8000:8000"

  # Front-end público (ADR 0015). Fala com a API interna do Django pela rede do Compose.
  front:
    build: ./web
    depends_on:
      - web
    environment:
      API_URL: http://web:8000
    ports:
      - "127.0.0.1:3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/saude/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
