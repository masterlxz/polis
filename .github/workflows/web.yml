name: Web

# Front-end Next.js (ADR 0015): instala com o lockfile e sem scripts de instalação,
# constrói, testa o servidor de produção e prova que a imagem do Docker constrói.
# O job `web` ainda não é exigido no ruleset protect-main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Instala o Node
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Instala as dependências (lockfile respeitado, sem scripts de instalação)
        run: npm ci --ignore-scripts

      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build

      - name: Testes
        run: npm test

      - name: A imagem do Docker constrói
        run: docker build --tag polis-web:ci .
