name: Compose

# Prova que o Docker Compose de desenvolvimento funciona de verdade: falha
# fechada sem segredos, portas só em 127.0.0.1, banco saudável, testes dentro
# do contêiner `web` e o app respondendo. O job `compose` não é exigido no
# ruleset protect-main.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Recusa subir sem POSTGRES_PASSWORD
        run: |
          if DJANGO_SECRET_KEY=descartavel docker compose config >/dev/null 2>erro.txt; then
            echo "::error::docker compose config aceitou a falta de POSTGRES_PASSWORD"
            exit 1
          fi
          grep -q "POSTGRES_PASSWORD" erro.txt

      - name: Recusa subir sem DJANGO_SECRET_KEY
        run: |
          if POSTGRES_PASSWORD=descartavel docker compose config >/dev/null 2>erro.txt; then
            echo "::error::docker compose config aceitou a falta de DJANGO_SECRET_KEY"
            exit 1
          fi
          grep -q "DJANGO_SECRET_KEY" erro.txt

      - name: Portas publicadas só em 127.0.0.1
        env:
          POSTGRES_PASSWORD: descartavel
          DJANGO_SECRET_KEY: descartavel
        run: |
          docker compose config --format json > config.json
          total=$(jq '[.services[].ports[]?] | length' config.json)
          locais=$(jq '[.services[].ports[]? | select(.host_ip == "127.0.0.1")] | length' config.json)
          echo "portas publicadas: $total; em 127.0.0.1: $locais"
          test "$total" -ge 2
          test "$total" -eq "$locais"

      - name: Sobe o banco e espera ficar saudável
        env:
          POSTGRES_PASSWORD: descartavel
          DJANGO_SECRET_KEY: descartavel
        run: docker compose up -d --wait db

      - name: Testes do projeto dentro do contêiner web
        env:
          POSTGRES_PASSWORD: descartavel
          DJANGO_SECRET_KEY: descartavel
        run: docker compose run --rm web pytest -v

      - name: App responde 200 em /admin/login/
        env:
          POSTGRES_PASSWORD: descartavel
          DJANGO_SECRET_KEY: descartavel
        run: |
          docker compose up -d web
          curl --retry 20 --retry-delay 2 --retry-all-errors \
            -fsS -o /dev/null -w '%{http_code}\n' http://127.0.0.1:8000/admin/login/

      - name: A imagem de produção constrói, sem dependências de teste, e passa no check --deploy
        run: |
          docker build --file Dockerfile.prod --tag polis-web-prod:ci .
          if docker run --rm polis-web-prod:ci python -c "import pytest" 2>/dev/null; then
            echo "::error::a imagem de produção traz o pytest"
            exit 1
          fi
          docker run --rm \
            --env DJANGO_SECRET_KEY="ci-chave-descartavel-com-bastante-entropia-0123456789abcdefghij" \
            --env DJANGO_ALLOWED_HOSTS=polis.example.org \
            --env DJANGO_HTTPS=1 --env DJANGO_BEHIND_PROXY=1 \
            polis-web-prod:ci python manage.py check --deploy 2>&1 | tee deploy.txt || true
          avisos=$(grep -o 'security\.W[0-9]*' deploy.txt | sort -u | tr '\n' ' ')
          echo "avisos: $avisos"
          test "$avisos" = "security.W004 security.W008 "
          docker run --rm polis-web-prod:ci ls staticfiles/admin >/dev/null

      - name: Logs em caso de falha
        if: failure()
        env:
          POSTGRES_PASSWORD: descartavel
          DJANGO_SECRET_KEY: descartavel
        run: docker compose logs --no-color --tail=100

      - name: Derruba tudo
        if: always()
        env:
          POSTGRES_PASSWORD: descartavel
          DJANGO_SECRET_KEY: descartavel
        run: docker compose down -v
