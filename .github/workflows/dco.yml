name: DCO

# Exige Signed-off-by em todo commit de PR (ADR 0004). Os testes do próprio
# script rodam antes. O job `dco` precisa ser exigido no ruleset protect-main.
on:
  pull_request:

jobs:
  dco:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Testes do check-dco
        run: .github/scripts/test-check-dco.sh

      - name: Todo commit do PR tem Signed-off-by
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: .github/scripts/check-dco.sh "$BASE_SHA" "$HEAD_SHA"
